{% load static %}
<!-- ========== START: POPULAR DESTINATIONS (reusable component) ========== -->
{% if popular_destinations %}
<section class="popular-destinations-area section-gap">
  <div class="container">
    <div class="row d-flex justify-content-center">
      <div class="menu-content pb-40 col-lg-8">
        <div class="title text-center">
          <h1 class="mb-10">Popular Destinations</h1>
          <p>Handpicked cities our travelers love the most — tap one to start your search.</p>
        </div>
      </div>
    </div>

    <div class="pd-carousel-wrap">

      <!-- تنها یک جفت فلش سراسری برای کل ردیف (نه داخل هر کارت) -->
      <button type="button" class="pd-nav pd-nav-prev" id="pdPrevBtn" aria-label="Previous destination">
        <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
      </button>

      <div class="pd-track" id="pdTrack" role="listbox" aria-label="Popular destinations" tabindex="0">
        {% for destination in popular_destinations %}
          <button type="button"
                  class="pd-card item"
                  data-destination-card
                  data-destination="{{ destination.name }}"
                  role="option"
                  aria-label="Search flights to {{ destination.name }}">

            {% if destination.image %}
              <img class="pd-card-img" src="{{ destination.image.url }}" alt="Flights to {{ destination.name }}" loading="lazy">
            {% else %}
              <img class="pd-card-img" src="{% static 'img/hero-bg.jpg' %}" alt="Flights to {{ destination.name }}" loading="lazy">
            {% endif %}

            <span class="pd-card-overlay" aria-hidden="true"></span>
            <span class="pd-card-badge" aria-hidden="true">{{ forloop.counter|stringformat:"02d" }}</span>

            <span class="pd-card-bottom">
              <span class="pd-card-text">
                <span class="pd-card-name">{{ destination.name }}</span>
                {% if destination.country %}
                  <span class="pd-card-subtitle">{{ destination.country }}</span>
                {% endif %}
              </span>
            </span>

          </button>
        {% endfor %}
      </div>

      <button type="button" class="pd-nav pd-nav-next" id="pdNextBtn" aria-label="Next destination">
        <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
      </button>
    </div>

    <!-- اسکرول‌بار سفارشی زیبا (به‌جای dots قبلی) -->
    <div class="pd-scrollbar" id="pdScrollbar" aria-hidden="true">
      <div class="pd-scrollbar-thumb" id="pdScrollbarThumb"></div>
    </div>

  </div>
</section>
{% endif %}
<!-- ========== END: POPULAR DESTINATIONS ========== -->
